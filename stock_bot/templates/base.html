<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Stock Bot{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --green: #2ecc71;
    --red: #ff5c5c;
    --yellow: #f5c451;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0; padding: 24px; line-height: 1.5;
  }
  .container { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
  }
  .badge-paper { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge-live { background: rgba(255,92,92,0.15); color: var(--red); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .symbol { font-weight: 700; white-space: nowrap; }
  .score { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .summary { color: var(--text); font-size: 13px; max-width: 340px; }
  .sources { margin-top: 4px; }
  .sources a { color: var(--accent); font-size: 12px; margin-right: 8px; text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .btn {
    display: inline-block; padding: 12px 24px; border-radius: 8px;
    font-weight: 700; font-size: 15px; border: none; cursor: pointer;
    text-decoration: none;
  }
  .btn-confirm { background: var(--green); color: #06210f; }
  .btn-confirm:hover { filter: brightness(1.1); }
  .btn-disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-link {
    background: none; border: none; color: var(--muted); font-size: 13px;
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  .notice {
    padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;
  }
  .notice-info { background: rgba(79,140,255,0.12); color: var(--accent); }
  .notice-warn { background: rgba(245,196,81,0.12); color: var(--yellow); }
  .notice-error { background: rgba(255,92,92,0.12); color: var(--red); }
  .total { font-size: 16px; font-weight: 700; margin: 16px 0 0; }
  label.confirm-check {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    font-size: 14px; color: var(--yellow);
  }
  .back-link { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
